# ============================================================
# CentralWatch — production stack (REAL AWS mode)
# ============================================================
# Run with:
#   docker compose -f docker-compose.aws.yml up -d --build                # standalone
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d   # override of dev
#
# When used as an override of docker-compose.yml, the `!reset` tags below
# REMOVE the LocalStack service, the demo-app dependency on it, and its
# storage volume that would otherwise be inherited from the dev file. The
# dev stack (docker-compose.yml alone) is untouched and keeps LocalStack.
#
# Differences from the development stack (docker-compose.yml):
#   * No LocalStack. boto3 uses the real AWS regional endpoints.
#   * AWS_PROVISION_RESOURCES=false — the app VALIDATES that every required
#     resource exists and fails fast if anything is missing. Pre-create the
#     resources listed in AWS_DEPLOYMENT.md (terraform/cloudformation or the
#     AWS console) and grant the least-privilege IAM policy from that doc.
#   * AWS_ENDPOINT_URL is empty — the standard AWS SDK default endpoints.
#   * Credentials come from the standard AWS credential chain (env vars,
#     ~/.aws/credentials, or an EC2/ECS/IRSA role) — nothing is hardcoded.
#   * AUTH_TOKEN_SECRET has NO default: compose refuses to start without it.
#   * Grafana admin credentials are injected from the environment.
#
# The image can be pulled from a registry (DEMO_APP_IMAGE) or built locally
# from demo-app/ (no pre-existing image required).
# ============================================================

services:
  proxy-db:
    image: postgres:16-alpine
    container_name: centralwatch-proxy-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PROXY_DB_NAME:-centralwatch}
      - POSTGRES_USER=${PROXY_DB_USER:-centralwatch}
      - POSTGRES_PASSWORD=${PROXY_DB_PASSWORD:?PROXY_DB_PASSWORD must be set}
    volumes:
      - proxy-db-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROXY_DB_USER:-centralwatch} -d ${PROXY_DB_NAME:-centralwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - centralwatch-network

  # Remove the LocalStack service inherited from docker-compose.yml (dev).
  # `!reset` (Compose >= 2.24) deletes the key instead of merging it.
  localstack: !reset {}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: centralwatch-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./configs/collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - centralwatch-network

  demo-app:
    image: ${DEMO_APP_IMAGE:-centralwatch-demo-app:local}
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    container_name: centralwatch-demo-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=centralwatch-demo-app
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      # Empty endpoint => real AWS default regional endpoints.
      - AWS_ENDPOINT_URL=
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      # "auto" is the SDK default — correct for real AWS.
      - AWS_S3_ADDRESSING_STYLE=auto
      # Real AWS: validate, never auto-create resources.
      - AWS_PROVISION_RESOURCES=false
      - LAMBDA_ROLE_ARN=${LAMBDA_ROLE_ARN:-}
      # Resource names (must already exist in AWS; all env-overridable).
      - S3_BUCKET=${S3_BUCKET:-centralwatch-files}
      - DYNAMODB_USERS_TABLE=${DYNAMODB_USERS_TABLE:-users}
      - DYNAMODB_ORDERS_TABLE=${DYNAMODB_ORDERS_TABLE:-orders}
      - DYNAMODB_FILES_TABLE=${DYNAMODB_FILES_TABLE:-files}
      - SNS_TOPIC=${SNS_TOPIC:-centralwatch-notifications}
      - SQS_QUEUE=${SQS_QUEUE:-centralwatch-queue}
      - LAMBDA_FUNCTION=${LAMBDA_FUNCTION:-centralwatch-image-processor}
      # REQUIRED — no default. Compose fails fast if it is not set.
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set}
      - TOKEN_TTL_SECONDS=${TOKEN_TTL_SECONDS:-86400}
      - PROXY_DB_HOST=proxy-db
      - PROXY_DB_PORT=5432
      - PROXY_DB_NAME=${PROXY_DB_NAME:-centralwatch}
      - PROXY_DB_USER=${PROXY_DB_USER:-centralwatch}
      - PROXY_DB_PASSWORD=${PROXY_DB_PASSWORD:?PROXY_DB_PASSWORD must be set}
      - PROXY_SECRET_ENCRYPTION_KEY=${PROXY_SECRET_ENCRYPTION_KEY:?PROXY_SECRET_ENCRYPTION_KEY must be set}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_METRICS_EXPORT_INTERVAL_MS=${OTEL_METRICS_EXPORT_INTERVAL_MS:-15000}
      - INIT_RECONCILE_INTERVAL_SECONDS=${INIT_RECONCILE_INTERVAL_SECONDS:-60}
      # Inert on real AWS: only consumed by entrypoint.sh when AWS_ENDPOINT_URL is set.
      - LOCALSTACK_WAIT_TIMEOUT_SECONDS=120
      - SIMULATE_TIMEOUT_SECONDS=${SIMULATE_TIMEOUT_SECONDS:-5}
      - SIMULATE_RETRY_ATTEMPTS=${SIMULATE_RETRY_ATTEMPTS:-3}
      # Opt in only after reviewing IAM and the production change process.
      - AWS_SECURITY_AGENT_ALLOW_REMEDIATION=${AWS_SECURITY_AGENT_ALLOW_REMEDIATION:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    depends_on:
      # Remove the LocalStack dependency inherited from docker-compose.yml.
      localstack: !reset
      proxy-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - centralwatch-network

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: centralwatch-prometheus
    restart: unless-stopped
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    ports:
      - "9090:9090"
    networks:
      - centralwatch-network
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:2.9.4
    container_name: centralwatch-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-storage:/loki
    ports:
      - "3100:3100"
    networks:
      - centralwatch-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: centralwatch-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./configs/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-storage:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - centralwatch-network

  grafana:
    image: grafana/grafana:12.4.0
    container_name: centralwatch-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - centralwatch-network

  frontend:
    image: nginx:1.27-alpine
    container_name: centralwatch-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./configs/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - demo-app
    networks:
      - centralwatch-network

networks:
  centralwatch-network:
    name: centralwatch-network
    driver: bridge

volumes:
  proxy-db-storage:
  prometheus-storage:
  loki-storage:
  tempo-storage:
  grafana-storage:
  # Remove the LocalStack storage volume inherited from docker-compose.yml.
  localstack-storage: !reset
