[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "centralwatch-security"
version = "0.1.0"
description = "Enterprise API Security and OWASP scanning plugin for FastAPI."
authors = [{ name = "CentralWatch Team" }]
dependencies = [
    "fastapi>=0.100.0",
    "opentelemetry-api>=1.20.0",
    "httpx>=0.24.0"
]
