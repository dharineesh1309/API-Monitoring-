global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: 'security-critical'
      continue: true

# No outgoing notifications yet: alerts are shown on the CentralWatch Alerts page, which reads them from
# Alertmanager. (The old placeholder webhooks POSTed to the app's /healthz every 15 s, which rejects POST,
# so each alert added 405 errors to the dashboards.) To notify people, add email_configs or slack_configs here.
receivers:
  - name: 'default'
  - name: 'security-critical'
