# CentralWatch frontend (nginx) — serves the prebuilt React SPA and proxies
# API calls to the FastAPI backend. The SPA calls /api/* (axios baseURL), while
# the backend routes live at /* — the /api/ prefix is stripped here, so the
# backend never needs an /api prefix. This keeps the monitoring stack a
# bystander: no telemetry ever passes through nginx.

# Docker may assign a new address whenever the backend container is recreated.
# Resolve the service name continuously instead of retaining the address nginx
# saw only when it started.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream centralwatch_backend {
    zone centralwatch_backend 64k;
    server demo-app:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dashboard assets change directly in the bind-mounted dist directory.
    # Disable browser caching here so a previous HTML fallback or stylesheet
    # cannot survive a dashboard update.
    location = /styles.css {
        try_files /styles.css =404;
        default_type text/css;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /app.js {
        try_files /app.js =404;
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /index.html {
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Security scans can legitimately run for up to 30 minutes. Keep this
    # exact route ahead of the general API proxy so nginx does not terminate a
    # healthy scan after the normal two-minute API timeout.
    location = /api/centralwatch/security-scan {
        proxy_pass http://centralwatch_backend/centralwatch/security-scan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1900s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # API reverse proxy (same-origin, so no CORS is required).
    # NOTE: do not add a regex location matching ^/api/ — regex locations
    # shadow this prefix location and break the proxy.
    location /api/ {
        proxy_pass http://centralwatch_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # The SPA opens /docs directly (Files page and footer "Backend API docs"
    # links). Without this rule /docs would resolve to the SPA fallback; route
    # it through the API proxy so it reaches FastAPI's Swagger UI. Exact-match
    # location — it never shadows the /api/ prefix location above.
    # absolute_redirect off makes the 302 relative (Location: /api/docs) so a
    # browser on any host/port (e.g. localhost:8080) follows it on the same
    # origin instead of being sent to nginx's port-less absolute URI.
    location = /docs {
        absolute_redirect off;
        return 302 /api/docs;
    }

    # FastAPI's Swagger/ReDoc pages embed the spec URL as an ABSOLUTE path
    # (/openapi.json), so even when the docs HTML is served through the /api
    # proxy the browser fetches the spec from the site root — which would hit
    # the SPA fallback (index.html). Proxy the exact path so the docs render.
    location = /openapi.json {
        proxy_pass http://centralwatch_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin health mesh used by the unified CentralWatch dashboard.
    # Keeping these checks behind nginx avoids browser CORS restrictions while
    # still testing each service over the shared Compose network.
    location = /system/demo {
        proxy_pass http://centralwatch_backend/healthz;
        add_header Cache-Control "no-store";
    }

    location = /system/grafana {
        proxy_pass http://grafana:3000/api/health;
        add_header Cache-Control "no-store";
    }

    location = /system/prometheus {
        proxy_pass http://prometheus:9090/-/ready;
        add_header Cache-Control "no-store";
    }

    location = /system/loki {
        proxy_pass http://loki:3100/ready;
        add_header Cache-Control "no-store";
    }

    location = /system/tempo {
        proxy_pass http://tempo:3200/ready;
        add_header Cache-Control "no-store";
    }

    location = /system/localstack {
        proxy_pass http://localstack:4566/_localstack/health;
        # LocalStack applies browser-origin checks when Origin or Referer is
        # forwarded. This is a same-origin server-side health check, so those
        # browser headers are irrelevant and can cause a false 403 status.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        add_header Cache-Control "no-store";
    }

    location = /system/collector {
        proxy_pass http://otel-collector:8889/metrics;
        add_header Cache-Control "no-store";
    }

    # SPA fallback (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
