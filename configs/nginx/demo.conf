# CentralWatch demo-frontend (nginx) — serves the React SPA on port 8090 and
# proxies /api/* to the demo-app backend only. This nginx instance is scoped
# to demo-app concerns: no platform services (Prometheus, Grafana, etc.) are
# exposed through it. It is intentionally isolated from the platform nginx.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream demo_backend {
    zone demo_backend 64k;
    server demo-app:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable browser caching for dashboard assets.
    location = /styles.css {
        try_files /styles.css =404;
        default_type text/css;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /app.js {
        try_files /app.js =404;
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /index.html {
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Security scans can run for up to 30 minutes — long timeout route.
    location = /api/centralwatch/security-scan {
        proxy_pass http://demo_backend/centralwatch/security-scan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1900s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # API reverse proxy — strips the /api prefix before forwarding to demo-app.
    location /api/ {
        proxy_pass http://demo_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    location = /docs {
        absolute_redirect off;
        return 302 /api/docs;
    }

    location = /openapi.json {
        proxy_pass http://demo_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Demo-app health check only — no platform services exposed here.
    location = /system/demo {
        proxy_pass http://demo_backend/healthz;
        add_header Cache-Control "no-store";
    }

    # SPA fallback (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
