# OpenTelemetry Collector Configuration for CentralWatch
# Configured with security, resource protection, and extensibility in mind.

receivers:
  # OTLP Receiver configuration supporting both gRPC and HTTP protocols.
  # This receives application telemetry from the FastAPI service.
  otlp:
    protocols:
      grpc:
        # Bind to all network interfaces inside the container for internal OTLP gRPC reception.
        endpoint: 0.0.0.0:4317
      http:
        # Bind to all network interfaces inside the container for internal OTLP HTTP/JSON reception.
        endpoint: 0.0.0.0:4318

processors:
  # Memory Limiter Processor prevents the collector from running out of memory.
  # Checked every 1s, it will drop/reject data if usage climbs past the threshold.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # Batch Processor pools telemetry events into batches before exporting.
  # This reduces connection overhead and improves export efficiency.
  batch:
    send_batch_size: 8192
    timeout: 5s
    send_batch_max_size: 10240

exporters:
  # Prometheus Exporter hosts a scrape endpoint.
  # Prometheus will connect to this endpoint to pull collected metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: centralwatch
    send_timestamps: true
    metric_expiration: 5m
    # Convert resource attributes (deployment.environment, service.name, ...)
    # to Prometheus labels. This is how the `deployment_environment` label gets its
    # value (development vs production) straight from the app's ENVIRONMENT setting,
    # so Prometheus needs no hardcoded value and no env expansion of its own.
    resource_to_telemetry_conversion:
      enabled: true

  # Loki Exporter for shipping logs
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

  # OTLP Exporter to ship traces to Tempo (gRPC)
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Debug exporter retained for opt-in troubleshooting. Do not attach it to
  # normal pipelines: detailed telemetry dumps generate thousands of Docker
  # log lines per minute and can make Docker Desktop sluggish.
  debug:
    verbosity: basic

  # Future OTLP Backend Exporter (Template for Member 4).
  # Commented out by default to avoid connection retry noise in logs.
  # To enable:
  # 1. Uncomment the lines below.
  # 2. Add 'otlp' to the active metrics pipeline exporters list.
  # otlp:
  #   endpoint: "backend:4317"
  #   tls:
  #     insecure: true

service:
  # Pipelines define how telemetry flows from Receivers through Processors to Exporters.
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # Add 'otlp' to the list below once uncommented in exporters to stream metrics to the backend.
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]

  # Telemetry configuration for the Collector's own internal metrics and logging.
  telemetry:
    logs:
      level: "info"
    metrics:
      address: "0.0.0.0:8888" # Internal telemetry endpoint for the collector itself
