name: CI

# Every branch and pull request, so a merge cannot quietly break the suites.
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      # Both suites are self-contained: AWS, PostgreSQL, DNS and ASTF are faked.
      AUTH_TOKEN_SECRET: ci-only-not-a-secret
      OTEL_SDK_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (same as the demo-app image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the demo-app, the centralwatch-security plugin and pytest
        run: pip install -r demo-app/requirements.txt -e ./centralwatch-security pytest

      - name: Run centralwatch-security tests
        run: pytest centralwatch-security/tests/ -v --tb=short

      - name: Run demo-app tests
        run: pytest demo-app/tests/ -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build demo-app image
        run: docker build -f demo-app/Dockerfile -t centralwatch-demo-app:ci .

      - name: Build inventory-service image
        run: docker build -f inventory-service/Dockerfile -t centralwatch-inventory:ci ./inventory-service

      - name: Build traffic-generator image
        run: docker build -f traffic-generator/Dockerfile -t centralwatch-traffic-gen:ci ./traffic-generator
